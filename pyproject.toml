[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "checkmate-switch"
version = "0.1.0"
description = "Local-first software-based dead man switch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CHECKMATE Maintainers" }
]
dependencies = [
    "cryptography>=41.0.0"
]

[project.scripts]
checkmate = "deadman_switch:run_cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --basetemp=.pytest_tmp -p no:cacheprovider"
